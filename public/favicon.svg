<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="careflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#careflow-grad)"/>

  <!-- Inner Border Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Medical Cross & Pulse Wave -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="220" y="128" width="72" height="256" rx="20" fill="url(#cross-grad)"/>
    <!-- Horizontal Cross Bar -->
    <rect x="128" y="220" width="256" height="72" rx="20" fill="url(#cross-grad)"/>
    <!-- Heartbeat Pulse Accent Line -->
    <path d="M 140 256 L 190 256 L 220 200 L 256 312 L 292 230 L 320 256 L 372 256" 
          fill="none" 
          stroke="#0D9488" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
